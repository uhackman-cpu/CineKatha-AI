# Planned local development services. Application containers will be added with implementation.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinekatha
      POSTGRES_USER: cinekatha
      POSTGRES_PASSWORD: cinekatha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinekatha -d cinekatha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
